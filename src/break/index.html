<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; media-src 'self' file:;"
  >
  <title>Cat Break</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="break-neko-overlay">
    <div class="break-hud">
      <span class="break-reminder-heading">
        <span id="reminderIcon" class="break-reminder-icon" aria-hidden="true"></span>
        <span id="reminderType">cat reminder</span>
      </span>
      <strong id="break-neko-countdown" aria-live="polite">--:--</strong>
      <p id="reminderMessage"></p>
    </div>
    <div class="break-cat-layer" aria-hidden="true">
      <img id="catStill" src="../../assets/break-neko-icon128.png" alt="Cat">
      <img id="customCatImage" alt="Custom cat">
      <video id="customCatVideo" autoplay muted playsinline loop preload="auto"></video>
      <video id="catRun" autoplay muted playsinline preload="auto"></video>
      <video id="catSleep" muted playsinline loop preload="auto"></video>
    </div>
    <div class="break-actions">
      <button id="snoozeBtn" type="button" aria-label="Snooze 5m">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6v6l4 2"></path><circle cx="12" cy="12" r="8"></circle></svg>
        <span>Snooze 5m</span>
      </button>
      <button id="dismissBtn" type="button" aria-label="Done">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
        <span>Done</span>
      </button>
    </div>
    <p class="break-shortcut-hint" id="shortcutHint">Press Esc to skip</p>
    <div id="assetFallback">
      <img id="fallbackCat" src="../../assets/break-neko-icon128.png" alt="Cat">
      <strong id="fallbackTitle">Cat break time</strong>
      <span id="fallbackMessage">The cat video asset could not be loaded, but your break is still running.</span>
    </div>
  </div>

  <script src="./break.js"></script>
</body>
</html>

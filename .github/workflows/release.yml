name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build and publish macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build macOS app (arm64, ad-hoc signed)
        run: npm run build:mac
        env:
          # No Apple Developer certificate is configured. electron-builder
          # falls back to ad-hoc signing, which lets the app run locally but
          # is not notarized. Disable auto keychain discovery so CI stays
          # deterministic and never tries to use an unexpected identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body_path: docs/release-notes-install.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pawkeeper-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip

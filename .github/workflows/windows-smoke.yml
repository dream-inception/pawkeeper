name: Windows Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Check and test on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run unit tests
        run: npm test
